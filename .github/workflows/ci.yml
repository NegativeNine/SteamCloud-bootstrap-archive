name: placeholder-archive-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python3 scripts/validate_placeholder.py
      - run: python3 scripts/test_validate_placeholder.py
      - run: python3 phase-00/validate.py
      - run: python3 phase-00/test_validate.py
      - run: git diff --check HEAD^ HEAD
      - run: git fsck --full
