name: placeholder-archive-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python3 scripts/validate_placeholder.py
      - run: python3 scripts/test_validate_placeholder.py
      - run: git diff --check HEAD^ HEAD
      - run: git fsck --full
